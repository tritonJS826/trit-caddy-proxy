services:
  caddy:
    image: caddy:latest
    container_name: caddy-gateway
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./status.html:/www/status.html:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_add:
      - NET_BIND_SERVICE

volumes:
  caddy_data:
  caddy_config: