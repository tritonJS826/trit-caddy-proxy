<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caddy Status</title>
  <style>
    body { font-family: monospace; background: #0d1117; color: #c9d1d9; padding: 2rem; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 2rem; text-align: center; max-width: 480px; }
    h1 { color: #58a6ff; margin: 0 0 0.5rem; }
    .status { font-size: 1.2rem; padding: 0.5rem 1rem; border-radius: 6px; display: inline-block; }
    .ok { color: #3fb950; border: 1px solid #3fb950; }
    .info { color: #8b949e; font-size: 0.85rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Caddy Proxy</h1>
    <p class="status ok">OK</p>
    <p class="info">Caddy is running on port 13500 with HTTPS</p>
  </div>
</body>
</html>
